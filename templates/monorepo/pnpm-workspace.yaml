packages:
  - "apps/*"
  - "packages/*"

publicHoistPattern:
  - '*expo-modules-core'
  - '*expo-modules-autolinking'
  - '*babel-preset-expo'
overrides:
  '@expo/dom-webview': 55.0.5
  fastify: ^5.8.5
  '@isaacs/brace-expansion': '>=5.0.1'
  flatted: '>=3.4.2'
  multer: '>=2.1.1'
  node-forge: '>=1.4.0'
  handlebars: '>=4.7.9'
  lodash: '>=4.18.0'
  seroval: '>=1.4.1'
  socket.io-parser: '>=4.2.6'
  svgo: '>=3.3.3'
  follow-redirects: '>=1.16.0'
  yauzl: '>=3.2.1'
  basic-ftp: '>=5.3.1'
  '@xmldom/xmldom': '>=0.8.13 <0.9.0'
  qs: '>=6.15.2'
  # security fixes — verified against osv-scanner
  shell-quote: '>=1.8.4'
  axios: '>=1.16.0'
  fast-xml-parser: '>=5.7.0'
  postcss: '>=8.5.10'
  "protobufjs@>=8.0.0 <9.0.0": '>=8.2.0 <9.0.0'
  ws: '>=8.20.1'
allowBuilds:
  '@firebase/util': true
  '@nestjs/core': true
  '@scarf/scarf': true
  '@swc/core': true
  chromedriver: true
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  ssh2: true
  unrs-resolver: true
