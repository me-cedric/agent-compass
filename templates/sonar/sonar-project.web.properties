# Backoffice Module - Independent SonarQube Configuration

sonar.projectKey=<project>-backoffice
sonar.projectName=<project> Backoffice
sonar.projectVersion=1.0
sonar.host.url=http://localhost:9002
sonar.sourceEncoding=UTF-8

# Source configuration
sonar.sources=src

# Test configuration
sonar.test.inclusions=**/__tests__/**
sonar.exclusions=coverage/**,build/**,node_modules/**,dist/**,.turbo/**,.tanstack/**,**/__tests__/**

# Coverage configuration
sonar.javascript.lcov.reportPaths=./coverage/lcov.info
sonar.coverage.exclusions=coverage/**,build/**
sonar.junit.reportPaths=test-report.xml

# File type definitions
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Issue ignore rules
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7

sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S7059
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.ts

sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2933
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.ts

sonar.issue.ignore.multicriteria.e3.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.html

sonar.issue.ignore.multicriteria.e4.ruleKey=Web:ImgWithoutAltCheck
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.html

sonar.issue.ignore.multicriteria.e5.ruleKey=Web:S6851
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.html

sonar.issue.ignore.multicriteria.e6.ruleKey=css:S4649
sonar.issue.ignore.multicriteria.e6.resourceKey=**/*.scss

sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S2301
sonar.issue.ignore.multicriteria.e7.resourceKey=**/*.ts
