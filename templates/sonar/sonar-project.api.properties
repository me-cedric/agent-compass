# API Module - Independent SonarQube Configuration

sonar.projectKey=<project>-api
sonar.projectName=<project> API
sonar.projectVersion=1.0
sonar.host.url=http://localhost:9002
sonar.sourceEncoding=UTF-8

# Source configuration
sonar.sources=src

# Test configuration
sonar.test.inclusions=src/*.spec.*,src/**/*.spec.*
sonar.exclusions=coverage/**,build/**,node_modules/**,dist/**,.turbo/**,features/**,src/*.spec.*,src/**/*.spec.*

# Coverage configuration
sonar.javascript.lcov.reportPaths=./coverage/lcov.info
sonar.coverage.exclusions=coverage/**,build/**
sonar.junit.reportPaths=test-report.xml

# File type definitions
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Issue ignore rules
sonar.issue.ignore.multicriteria=e1,e2,e7

sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S7059
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.ts

sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2933
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.ts

sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S2301
sonar.issue.ignore.multicriteria.e7.resourceKey=**/*.ts

# SCM tracking — lets SonarQube natively auto-close issues whose detection lines
# no longer exist in later scans. Pair with the per-project server-side value
# that scripts/sonar-setup.sh sets, plus scripts/bulk-close-stale-issues.mjs as a
# script-level safety net for cases SCM still misses (excluded files, shallow clones).
sonar.scm.provider=git
sonar.scm.disabled=false

# Optional: defer a noisy refactor rule (e.g. cognitive complexity S3776) when the
# fix is a multi-PR refactor. Scope resourceKey to the specific files — NOT **/* —
# so new code still trips the rule. Add the eN key to the multicriteria list above.
# Example:
#   sonar.issue.ignore.multicriteria.e8.ruleKey=typescript:S3776
#   sonar.issue.ignore.multicriteria.e8.resourceKey=src/path/to/legacy-file.ts
