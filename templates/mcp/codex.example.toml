# Copy selected servers into ~/.codex/config.toml or a repo-local .codex/config.toml.

[mcp_servers.projectmem]
enabled = true
required = false
command = "/absolute/path/to/repo/.venv/bin/python"
args = ["-m", "projectmem.mcp_server", "--root", "/absolute/path/to/repo"]
enabled_tools = ["brief", "precheck", "show", "log"]
default_tools_approval_mode = "prompt"

[mcp_servers.figma]
enabled = true
required = false
url = "http://127.0.0.1:3845/mcp"
enabled_tools = ["get_file", "get_selection", "get_code_connect_map"]
default_tools_approval_mode = "prompt"
