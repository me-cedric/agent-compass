# Vale configuration — prose and terminology control for a docs/specs repo.
# Guide: docs/tooling/vale.md
#
# Copy this file AND the sibling .vale/ directory to the repo root, then edit
# .vale/styles/House/Terminology.yml to hold the project's own vocabulary.
# Keep exactly one .vale.ini per repo: overlapping configs are two truths.

StylesPath = .vale/styles

# Report warnings and errors; suggestions stay silent until someone asks for them.
MinAlertLevel = warning

# Vocabulary and heading rules apply to every Markdown file. Structural rules do
# not: an index or a README has no required sections.
[*.md]
BasedOnStyles = House
House.RequiredSectionIntent = NO

# Structural rules apply only where a document shape is actually normative.
# Widen this glob deliberately, one directory at a time, after measuring what the
# existing documents contain — a rule that fails everywhere gets ignored.
[docs/specs/*.md]
BasedOnStyles = House
House.RequiredSectionIntent = error
