name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Syntax-check scripts
        run: for f in scripts/*.mjs; do node --check "$f"; done
      - name: Enforce GitHub Actions versions
        run: node scripts/check-actions.mjs
      - name: Run checks
        run: npm run check
