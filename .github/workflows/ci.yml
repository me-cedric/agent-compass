name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Syntax-check scripts
        run: for f in scripts/*.mjs; do node --check "$f"; done
      - name: Enforce GitHub Actions versions
        run: node scripts/check-actions.mjs
      - name: Run checks
        run: npm run check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Windows only in effect (macOS reads TMPDIR): the runner's TEMP has a short 8.3 name, git prints the long name. One name for both.
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Trust the temp repositories that the tests create
        run: git config --global --add safe.directory "*"
      - name: Run tests
        run: npm test
