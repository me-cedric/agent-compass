name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Syntax-check scripts
        run: for f in scripts/*.mjs; do node --check "$f"; done
      - name: Run tests
        run: npm test
      - name: Enforce generic naming
        run: node scripts/check-naming.mjs
      - name: Enforce index freshness
        run: node scripts/check-indexes.mjs
