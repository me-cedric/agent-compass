name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Syntax-check scripts
        run: for f in scripts/*.mjs; do node --check "$f"; done
      - name: Enforce GitHub Actions versions
        run: node scripts/check-actions.mjs
      - name: Run tests
        run: npm test
      - name: Enforce generic naming
        run: node scripts/check-naming.mjs
      - name: Enforce index freshness
        run: node scripts/check-indexes.mjs
      - name: Check docs and template placeholders
        run: node scripts/check-docs.mjs
