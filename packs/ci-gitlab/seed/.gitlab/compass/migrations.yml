# compass-migrations: two gates for database migrations.
# 1. A merge request does not change or delete a migration file that the target branch has.
# 2. The migration generator gives no new file: each schema change has its migration.
# Include it from .gitlab-ci.yml:
#   include:
#     - local: .gitlab/compass/migrations.yml
# Edit MIGRATIONS_DIR, the install command, the cache key and the generator. The generator must run without a database.
# The npm cache is keyed on the lockfile. GitLab keeps the caches of protected branches apart by default,
# so the first pipeline of a merge request starts cold. Keep that setting: a shared cache lets any branch write what main reads.

compass-migrations:
  stage: test
  image: node:24
  interruptible: true
  cache:
    key:
      files: [package-lock.json] # edit: your lockfile
    paths: [.npm/]
  variables:
    MIGRATIONS_DIR: drizzle # edit: the migrations directory
    GIT_DEPTH: 0
  script:
    # A wrong MIGRATIONS_DIR makes both gates pass on nothing. This check makes it fail.
    - |
      if [ -z "$(git ls-files -- "$MIGRATIONS_DIR/*.sql")" ]; then
        echo "No .sql file in $MIGRATIONS_DIR. Set MIGRATIONS_DIR to the migrations directory."
        exit 1
      fi
    - git fetch --quiet origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - changed=$(git diff --name-only --diff-filter=MDR FETCH_HEAD...HEAD -- "$MIGRATIONS_DIR/*.sql")
    - |
      if [ -n "$changed" ]; then
        echo "Add a new migration. Do not change or delete an applied one:"
        echo "$changed"
        exit 1
      fi
    - npm ci --cache .npm --prefer-offline # edit: your install command
    - npx drizzle-kit generate # edit: your migration generator
    - |
      drift=$(git status --porcelain -- "$MIGRATIONS_DIR")
      if [ -n "$drift" ]; then
        echo "The schema changed without a migration. Run the generator and commit its output:"
        echo "$drift"
        exit 1
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
